# SPDX-License-Identifier: Apache-2.0
# The Python package set of the TCAD image (ghcr.io/mithro/gf180-tcad-tcad), as a non-package uv
# project. Python 3.13 is required because meshwell >= 2.4 needs it, so this set cannot live in the
# root uv.lock (requires-python >= 3.12). Exported, hashed, to requirements.lock:
#   uv export --project docker/tcad --locked --no-emit-project --format requirements-txt --hashes
# Relock (offline-reproducible thanks to exclude-newer):  uv lock --project docker/tcad
[project]
name = "gf180tcad-tcad-image"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "devsim==2.11.1",
    "meshwell==2.5.2",
    "gmsh==4.15.2",
    "gdsfactory==9.51.0",
    # Must equal the numpy pin of docker/base/requirements.lock (tests/test_tcad_lock.py).
    "numpy==2.5.4",
    # The calibration optimiser (scipy.optimize.least_squares).
    "scipy>=1.18.1",
    # The fork's tests run inside this image.
    "pytest>=9.1.1",
    # gplugins 2.1.5 runtime dependencies (its pyproject.toml); gplugins itself is NOT installed:
    # it comes from the third_party/gplugins submodule via gf180tcad-gplugins.pth.
    "pint>=0.26.1",
    "tqdm>=4.70.1",
    "xarray>=2023.8,<2026.10",
]

[tool.uv]
package = false
exclude-newer = "2026-10-18T12:00:00Z"
