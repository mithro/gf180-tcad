version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      # the same uv as CI (.github/workflows/*.yml, astral-sh/setup-uv version)
      - asdf install uv 0.13.1
      - asdf global uv 0.13.1
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --only-group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
