# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gf180tcad"
version = "0.1.0.dev0"
description = "Open-source TCAD for GF180MCU transistors, validated against the PDK SPICE models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/gf180tcad"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "sandbox: test that runs a simulator through tools/sandbox-run (needs Docker)",
]

[tool.ruff]
line-length = 100
