# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gf180tcad"
version = "0.1.0.dev0"
description = "Open-source TCAD for GF180MCU transistors, validated against the PDK SPICE models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.5.4",
]

[project.urls]
Documentation = "https://gf180-tcad.readthedocs.io/"

[dependency-groups]
dev = ["pytest", "ruff"]
docs = [
    "furo>=2025.12.19",
    "matplotlib>=3.11.2",
    "myst-parser>=5.1.0",
    "numpy>=2.5.4",
    "sphinx>=9.1.0",
]
image = [
    "devsim>=2.11.0",
    "gdsfactory>=9.51.0",
    "numpy>=2.5.4",
]
image-build = [
    "setuptools>=84.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gf180tcad"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "sandbox: test that runs a simulator through tools/sandbox-run (needs Docker)",
]

[tool.ruff]
line-length = 100
# third_party/gplugins is the mithro/gplugins fork (a git submodule), linted by its own CI.
extend-exclude = ["third_party"]
