[param.cf_f_per_m]
value = 7.270908919531098e-11
unit = "F/m"
provenance = "spice-card"
source = "sm141064.ngspice:37309; sm141064.ngspice:37126; https://www.bsim.berkeley.edu/BSIM4/BSIM450.zip"
fixed = true
role = "reference-bookkeeping"
bsim_name = "cf"
derived_from = ["toxe_nm", "epsrox"]
note = "CF: outer fringing capacitance per width. The card sets no CF, so BSIM4 uses its default 2*EPSROX*eps0/pi*ln(1+4e-7/TOXE) (manual eq. 7.5.1), from TOXE and EPSROX. 1D only."
