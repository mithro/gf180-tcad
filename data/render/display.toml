# SPDX-License-Identifier: Apache-2.0
# Display-only physical values for the 3D renders (gf180tcad.render.manifest): the band gaps and
# the Si/SiO2 band offsets a band diagram is drawn with. No simulation reads this file. A render
# names each value it uses as a manifest entry ({"toml": [section, key]}), like any other
# quantity. Each value's source cites an anchor of docs/limitations/literature.md.

note = "display only: not an input to any simulation"
mismatch = "The simulation runs at T = 298.15 K and scales n_i by exp(-6726 K (1/T - 1/300 K)) (gf180tcad.tcad.process.Constants.n_i_cm3), which implies E_g = 1.16 eV (2 x 6726 K x k_B/q). The drawing uses the 300 K value of Sze and Ng, E_g = 1.12 eV. The band gap in the image is a display value, not the simulation's."

[silicon]
band_gap_ev = 1.12
nc_cm3 = 2.8e19
nv_cm3 = 2.65e19

[silicon.units]
band_gap_ev = "eV"
nc_cm3 = "cm^-3"
nv_cm3 = "cm^-3"

[silicon.sources]
band_gap_ev = "Sze and Ng 2006 (lit-sze), Appendix G, Properties of Si and GaAs: energy gap of Si at 300 K"
nc_cm3 = "Sze and Ng 2006 (lit-sze), Appendix G, Properties of Si and GaAs: effective density of states in the conduction band of Si at 300 K"
nv_cm3 = "Sze and Ng 2006 (lit-sze), Appendix G, Properties of Si and GaAs: effective density of states in the valence band of Si at 300 K"

[sio2]
band_gap_ev = 9.0
conduction_offset_ev = 3.2
valence_offset_ev = 4.7

[sio2.units]
band_gap_ev = "eV"
conduction_offset_ev = "eV"
valence_offset_ev = "eV"

[sio2.sources]
band_gap_ev = "Sze and Ng 2006 (lit-sze), Appendix H, Properties of SiO2 and Si3N4: energy gap of SiO2 at 300 K"
conduction_offset_ev = "Sze and Ng 2006 (lit-sze), ch. 4, the Si-SiO2 energy-band diagram: conduction-band barrier for electrons"
valence_offset_ev = "Sze and Ng 2006 (lit-sze), ch. 4, the Si-SiO2 energy-band diagram: valence-band barrier for holes"
