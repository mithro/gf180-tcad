# SPDX-License-Identifier: Apache-2.0
# Every value that the public sources read for issue #88 give for the six display quantities of
# data/render/display.toml. The display file takes the row marked `used` of each quantity. No
# simulation reads this file. gf180tcad.display_sources reads it; docs/reproduce/display-values.md
# draws and tabulates it. Each `source` is an anchor of docs/limitations/literature.md, named for
# the page by [names].
#
# basis: "listed" when the source prints the number; "computed" when the number is our arithmetic,
# N = 2 (2 pi m k_B T / h^2)^(3/2) at [dos].temperature_k, from the density-of-states mass the
# source gives. A row with mass_m0 gives the mass (in free-electron masses) its value goes with,
# and digits the significant figures the value carries.

note = "display only: not an input to any simulation"

[names]
lit-ioffe = "Ioffe archive"
lit-colorado-constants = "Colorado sheet"
lit-wikipedia-effective-mass = "Wikipedia masses"
lit-wikipedia-band-gap = "Wikipedia"
lit-alkauskas = "Alkauskas et al."
lit-shaltaf = "Shaltaf et al."

[quantities]
"silicon.band_gap_ev" = "silicon band gap"
"silicon.nc_cm3" = "N_c of silicon"
"silicon.nv_cm3" = "N_v of silicon"
"sio2.band_gap_ev" = "SiO₂ band gap"
"sio2.conduction_offset_ev" = "Si/SiO₂ conduction band offset"
"sio2.valence_offset_ev" = "Si/SiO₂ valence band offset"

# The unit of each quantity, as the page and the figures print it.
[units]
"silicon.band_gap_ev" = "eV"
"silicon.nc_cm3" = "cm⁻³"
"silicon.nv_cm3" = "cm⁻³"
"sio2.band_gap_ev" = "eV"
"sio2.conduction_offset_ev" = "eV"
"sio2.valence_offset_ev" = "eV"

# The densities of states are taken at this temperature.
[dos]
temperature_k = 300.0

# Ioffe's temperature dependence of silicon's band gap,
# E_g = e0_ev - alpha_ev_per_k T^2 / (T + beta_k), T in K ("Temperature Dependences").
[ioffe_gap]
source = "lit-ioffe"
e0_ev = 1.17
alpha_ev_per_k = 4.73e-4
beta_k = 636.0

