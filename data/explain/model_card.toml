# Model-selector values of the PDK's ngspice model card that the explainer pages print (read by
# gf180tcad.explain.numbers). The card is the one data/process/nfet_05v0.toml names (same file,
# sha256 and model). Each value is the card's own `+ key=value` line, named by its line number;
# the sandbox test tests/tcad/test_process.py::test_explain_model_card_lines reads the card in
# the image and checks every line, and tests/test_explained.py ties this file to the process file.

schema = 1

[card]
file = "libs.tech/ngspice/sm141064.ngspice"
sha256 = "69a7ab877344a6d477fdd11440457f64e7ad88a624504a737a161da463de8bc8"

[nfet_05v0]
model = "nfet_06v0.0"
model_line = 37055

# BSIM4 AC small-signal non-quasi-static model selector (manual section 8.1, appendix A).
[nfet_05v0.acnqsmod]
value = 0
card_line = 37060

# BSIM4 transient non-quasi-static model selector (manual section 8.1, appendix A).
[nfet_05v0.trnqsmod]
value = 0
card_line = 37316
