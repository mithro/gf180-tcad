# SPDX-License-Identifier: Apache-2.0
# External link check of the documentation (sphinx-build -b linkcheck) and of the URLs in
# README.md and CONTRIBUTING.md, which are not part of the Sphinx build.
# Network-dependent by design, so it is separate from the offline docs build and not a required
# check: an upstream outage must not block unrelated work. Links into this repository
# ({repo}/{test} roles) are validated offline at build time by docs/_ext/repo_roles.py and are
# ignored here (docs/conf.py: linkcheck_ignore).
name: linkcheck

on:
  pull_request:
    # src/** too: the API pages and the generated results pages come from docstrings and from
    # src/gf180tcad/docgen.py.
    paths: ["docs/**", "src/**", "README.md", "CONTRIBUTING.md", ".github/workflows/linkcheck.yml"]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: a newer push to a pull request cancels the older run; scheduled and manual runs
# are each their own group and never cancelled.
concurrency:
  group: linkcheck-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linkcheck:
    name: linkcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read lets a scheduled run list and download the previous scheduled run's artifact.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      # A scheduled run also keeps how many scheduled runs in a row each URL has timed out: the
      # counts travel as the "linkcheck-timeouts" artifact of the run, and the next scheduled run
      # downloads them (tools/linkcheck_report.py). A URL that times out in 3 runs in a row fails.
      - name: Previous timeout counts
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python -I tools/linkcheck_report.py fetch-state --workflow linkcheck.yml --out docs/_build/previous/timeouts.json
      - name: Sphinx linkcheck
        # Sphinx exits 1 for a timeout as well as for a dead link. A slow external site is not a
        # defect of the change (issue #93), so tools/linkcheck_report.py replaces the exit code by
        # the "broken" entries of output.json; timeouts are shown as warnings.
        env:
          STATE_ARGS: ${{ github.event_name == 'schedule' && '--previous docs/_build/previous/timeouts.json --state-out docs/_build/state/timeouts.json' || '' }}
        run: |
          set +e
          uv run --locked --group docs sphinx-build -b linkcheck docs docs/_build/linkcheck
          status=$?
          set -e
          # STATE_ARGS is unquoted on purpose: it holds two options or nothing.
          uv run --no-project python -I tools/linkcheck_report.py report --status "$status" --json docs/_build/linkcheck/output.json $STATE_ARGS
      - name: Show the linkcheck report
        if: always()
        run: |
          if [ -f docs/_build/linkcheck/output.txt ]; then
            cat docs/_build/linkcheck/output.txt
            cat docs/_build/linkcheck/output.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      # Sphinx ignores links to this repository's issues and pull requests because github.com
      # answers them with HTTP 429 (issue #87). This step checks the numbers through the API.
      - name: Issue and pull request links exist
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python -I tools/linkcheck_report.py numbers --repo "${GITHUB_REPOSITORY}"
      # README.md and CONTRIBUTING.md are not part of the Sphinx build. tools/linkcheck_report.py
      # fetches their links (issue #136): a broken link fails, a timeout warns and, on a scheduled
      # run, counts in the same state file as the Sphinx timeouts.
      - name: README.md and CONTRIBUTING.md links
        if: always()
        env:
          STATE_ARGS: ${{ github.event_name == 'schedule' && '--previous docs/_build/previous/timeouts.json --state-out docs/_build/state/timeouts.json' || '' }}
        # STATE_ARGS is unquoted on purpose: it holds two options or nothing.
        run: uv run --no-project python -I tools/linkcheck_report.py urls README.md CONTRIBUTING.md $STATE_ARGS
      - name: Keep the timeout counts for the next scheduled run
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkcheck-timeouts
          path: docs/_build/state/timeouts.json
          if-no-files-found: ignore
