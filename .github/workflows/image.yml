# SPDX-License-Identifier: Apache-2.0
# Reproducible builds of the three project images, one matrix entry each:
#   base: ghcr.io/mithro/gf180-tcad-base  (docker/base/, pinned by docker/IMAGE)
#   tcad: ghcr.io/mithro/gf180-tcad-tcad  (docker/tcad/, pinned by docker/TCAD_IMAGE; built FROM
#         docker/IMAGE, which is public, so no login is needed to pull it)
#   tcad-dev: ghcr.io/mithro/gf180-tcad-tcad-dev  (docker/tcad-dev/, pinned by
#         docker/TCAD_DEV_IMAGE; the TCAD stack at development HEAD (meshwell and gf180mcu from
#         the mithro forks), pinned by commit in docker/tcad-dev/upstream.json, every input
#         fetched from the gf180-tcad input mirror first, DEVSIM compiled from source; also FROM
#         docker/IMAGE)
#   PRs:  push tag pr-<number>;  main: push latest and sha-<commit>; both only after the
#         IMAGE_ID, pin and versions checks passed (the build pushes only the staging tag
#         `unverified`, which may point at an unverified image);
#   weekly schedule / manual dispatch: rebuild and verify only, never push or retag.
# "Reproducible" = identical image config digest (image ID, covers layer diff_ids); the
# manifest digest is reproducible too. Every build must equal docker/<image>/IMAGE_ID (config)
# and its pin file (manifest, the image tools/sandbox-run --image uses); the rebuild job builds
# again from scratch on a fresh runner and must match the committed digests as well. The provenance
# probe is run in the pinned image and must reproduce docker/<image>/versions.json exactly.
name: image

on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/image.yml"]
  pull_request:
    paths: ["docker/**", ".github/workflows/image.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Least privilege: only the build-push job may write packages.
permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # never cancel main: every sha-<commit> tag must be pushed
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUSH: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  build:
    name: build-push (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: base
            name: ghcr.io/mithro/gf180-tcad-base
            pin: docker/IMAGE
          - image: tcad
            name: ghcr.io/mithro/gf180-tcad-tcad
            pin: docker/TCAD_IMAGE
          - image: tcad-dev
            name: ghcr.io/mithro/gf180-tcad-tcad-dev
            pin: docker/TCAD_DEV_IMAGE
    env:
      IMAGE_NAME: ${{ matrix.name }}
      DIR: docker/${{ matrix.image }}
      PIN: ${{ matrix.pin }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push the staging tag on PRs / main)
        id: build
        run: |
          # Only the staging tag is pushed here; the published tags follow the checks below.
          args=()
          if [ "$PUSH" = true ]; then
            args=(--push --tag "$IMAGE_NAME:unverified")
          fi
          config="$("$DIR/build" "${args[@]}" --metadata meta.json)"
          manifest="$(jq -r '."containerimage.digest"' meta.json)"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          {
            echo "### ${IMAGE_NAME##*/} (${{ github.event_name }}, push=$PUSH)"
            echo "- config digest (image ID): \`$config\`"
            echo "- committed $DIR/IMAGE_ID: \`$(cat "$DIR/IMAGE_ID")\`"
            echo "- built manifest: \`$IMAGE_NAME@$manifest\`"
            echo "- committed $PIN: \`$(cat "$PIN")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat meta.json
      - name: Config digest matches IMAGE_ID
        run: |
          want="$(cat "$DIR/IMAGE_ID")"
          got="${{ steps.build.outputs.config }}"
          [ "$got" = "$want" ] || { echo "::error::config digest $got != $DIR/IMAGE_ID $want"; exit 1; }
      - name: Manifest matches the pin file
        run: |
          want="$(cat "$PIN")"
          got="$IMAGE_NAME@${{ steps.build.outputs.manifest }}"
          [ "$got" = "$want" ] || { echo "::error::built $got != $PIN $want"; exit 1; }
      - name: versions.json matches the probe run in the pinned image
        run: |
          image="$(cat "$PIN")"
          docker pull --quiet "$image"
          docker run --rm --network=none --read-only --tmpfs /tmp \
            -v "$PWD:/work/src:ro" -e PYTHONPATH=/work/src/src \
            "$image" python3 "/work/src/$DIR/probe_versions.py" > probe.json
          diff -u "$DIR/versions.json" probe.json \
            || { echo "::error::$DIR/versions.json is stale (diff above)"; exit 1; }
      - name: Tag the verified image
        if: env.PUSH == 'true'
        run: |
          # Retag by manifest digest (no new manifest: --prefer-index=false), then check that
          # every published tag resolves to exactly that digest.
          manifest="${{ steps.build.outputs.manifest }}"
          if [ "${{ github.event_name }}" = pull_request ]; then
            tags=("$IMAGE_NAME:pr-${{ github.event.pull_request.number }}")
          else
            tags=("$IMAGE_NAME:latest" "$IMAGE_NAME:sha-${{ github.sha }}")
          fi
          args=()
          for t in "${tags[@]}"; do args+=(--tag "$t"); done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE_NAME@$manifest"
          for t in "${tags[@]}"; do
            got="sha256:$(docker buildx imagetools inspect --raw "$t" | sha256sum | cut -d' ' -f1)"
            [ "$got" = "$manifest" ] || { echo "::error::$t is $got, not $manifest"; exit 1; }
            echo "- tagged \`$t\` = \`$manifest\`" >> "$GITHUB_STEP_SUMMARY"
          done

  rebuild:
    name: reproducible (${{ matrix.image }})
    needs: build
    # Every entry verifies against its own committed files even when another entry's build
    # failed (a base-only change fails the tcad entry until its pins are refreshed).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: base
            name: ghcr.io/mithro/gf180-tcad-base
            pin: docker/IMAGE
          - image: tcad
            name: ghcr.io/mithro/gf180-tcad-tcad
            pin: docker/TCAD_IMAGE
          - image: tcad-dev
            name: ghcr.io/mithro/gf180-tcad-tcad-dev
            pin: docker/TCAD_DEV_IMAGE
    env:
      IMAGE_NAME: ${{ matrix.name }}
      DIR: docker/${{ matrix.image }}
      PIN: ${{ matrix.pin }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Rebuild from scratch and compare
        run: |
          got="$("$DIR/build" --no-cache --metadata meta.json)"
          manifest="$IMAGE_NAME@$(jq -r '."containerimage.digest"' meta.json)"
          want="$(cat "$DIR/IMAGE_ID")"
          pinned="$(cat "$PIN")"
          cat meta.json
          echo "rebuild=$got IMAGE_ID=$want manifest=$manifest pin=$pinned"
          echo "- ${IMAGE_NAME##*/} rebuild config \`$got\` (IMAGE_ID \`$want\`); manifest \`$manifest\` ($PIN \`$pinned\`)" >> "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$want" ] || { echo "::error::rebuild $got != $DIR/IMAGE_ID $want"; exit 1; }
          [ "$manifest" = "$pinned" ] || { echo "::error::rebuild $manifest != $PIN $pinned"; exit 1; }
