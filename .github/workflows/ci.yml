# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going for the older commit, so a
# burst of fix-up pushes ends in one result (one notification), not one failure per superseded
# commit. Runs on main are never cancelled: each commit is its own group (GitHub keeps one running
# and one pending run per group and cancels the pending one when a third arrives, whatever
# cancel-in-progress says), so every merge commit gets its own complete run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The submodule (third_party/gplugins) is checked out: tests/tcad/test_tcad_provenance.py
      # hashes its gplugins/devsim files and reads its commit for the TCAD provenance.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      # --group docs: tests/test_docgen.py renders the plots and builds the docs.
      - run: uv sync --locked --group docs
      # The same target as the local pre-push hook (tools/install-hooks): ruff check, ruff format.
      - run: make lint
      - name: Generate de_DE.UTF-8 locale (so test_csv_bytes_stable_under_locale runs, not skips)
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a
      # GH_TOKEN: tests/test_submodule.py asks the GitHub API (gh) whether the third_party/gplugins
      # pin is on mithro/gplugins main.
      - run: uv run pytest -m "not sandbox" -rs -v
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: uv run --locked --group docs sphinx-build -W -b html docs docs/_build
