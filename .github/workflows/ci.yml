# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: Generate de_DE.UTF-8 locale (so test_csv_bytes_stable_under_locale runs, not skips)
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a
      - run: uv run pytest -m "not sandbox" -rs -v
